version: '3.9'

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lexos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lexos
      POSTGRES_USER:     lexos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexos_user -d lexos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lexos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:        production
      PORT:            4000
      DATABASE_URL:    postgresql://lexos_user:${POSTGRES_PASSWORD}@postgres:5432/lexos?sslmode=disable
    env_file:
      - ../.env
    ports:
      - "4000:4000"
    volumes:
      - document_storage:/app/storage

  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lexos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  document_storage:
